version: "3.9"

services:
  # ─── FastAPI Backend ───────────────────────────────────────
  backend:
    build: ./backend
    container_name: attendiq-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DEMO_MODE=true
    env_file:
      - ./backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ─── React Web Dashboard ────────────────────────────────────
  web:
    build: ./web
    container_name: attendiq-web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_DEMO_MODE=true
    command: npm run dev -- --host
    restart: unless-stopped
    depends_on:
      - backend

networks:
  default:
    name: attendiq-network
