name: attendiq_mobile
description: AttendIQ - AI-Driven Biometric Attendance System
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.3

  # HTTP & networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Camera & face
  camera: ^0.10.5+9
  image: ^4.1.3

  # Location
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # BLE
  flutter_blue_plus: ^1.31.4

  # Local storage
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # QR scanning
  mobile_scanner: ^3.5.6

  # UI
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/models/
